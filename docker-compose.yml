version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
    volumes:
      - .:/app

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Note: SigNoz self-hosted stack is expected to be run separately
  # via the foundry/casting.yaml or their official install script.
